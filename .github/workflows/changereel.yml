name: What changed
on:
  pull_request:
    # "closed" only takes the previews of the pull request off their branch
    types: [opened, synchronize, reopened, closed]

jobs:
  changereel:
    # Pull requests from forks get no secrets and should not run the model
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # for the preview on its branch
      pull-requests: write # for the comment
    env:
      GH_TOKEN: ${{ github.token }} # for the Markdown API in the build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base commit has to be there
      - uses: derblub/changereel@v0
        with:
          # The profile is a README, not a site: GitHub renders it to HTML, next to the banners
          build: >-
            mkdir -p _site && cp banner-*.svg _site/ &&
            { printf '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>derblub</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.css"></head><body><article class="markdown-body" style="max-width:830px;margin:32px auto;padding:0 16px">';
            gh api markdown -f mode=gfm -f context=derblub/derblub -F text=@README.md;
            printf '</article></body></html>'; } > _site/index.html
          serve: python3 -m http.server {port} --bind 127.0.0.1 --directory _site
          routes: /
          ignore: picture # the banner is animated
          narrate: claude-opus-5-5
          language: en
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
